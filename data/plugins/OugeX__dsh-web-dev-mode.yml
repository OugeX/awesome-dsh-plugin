description:
  en: A web development preset with 12 companion skills that asks five clarifying questions before writing code, delivers in three verifiable rounds, and encodes conventions from stack choice to deployment ops.
  zh: Web 开发模式：写代码前先问五个澄清问题、分三轮可验证交付，并内置从技术选型到部署运维的 12 个工程技能（表设计、分层、鉴权、前端架构、测试、部署等）。
